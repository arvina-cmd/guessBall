spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/guessball
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
    encoding: UTF-8
  mvc:
    hiddenmethod:
      filter:
        enabled: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

football-api:
  base-url: https://api.football-data.org/v4
  api-key: e59bfe0eee1e47d28edc52261af15248

scheduler:
  sync-cron: "0 0 2 * * *"
  poll-cron: "0 * * * * *"

server:
  port: 8080

logging:
  level:
    com.guessball: DEBUG
